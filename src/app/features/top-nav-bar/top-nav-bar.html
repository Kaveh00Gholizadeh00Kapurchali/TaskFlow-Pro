<mat-toolbar>
  <a class="brand-title" routerLink="/" aria-label="TaskFlow home">
    <span aria-hidden="true">⚡</span><span>TaskFlow <strong>Pro</strong></span>
  </a>
  <span class="navbar-spacer"></span>
  <div class="nav-clock" aria-label="Current date and time">
    <span class="datetime-badge time">{{ FormatTime(timeZone) }}</span>
    <span class="datetime-badge">{{ FormatDate(timeZone) }}</span>
  </div>
  <nav class="nav-links" aria-label="Main navigation">
    <a [routerLink]="homeURL || '/'" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" mat-button>Home</a>
    <app-theme-toggle />
    @if (auth.C_currentUser(); as user) {
      @if (user.userRole === 'admin' || user.userRole === 'manager') {
        <a [routerLink]="taskManagementURL" routerLinkActive="active" mat-button>Tasks</a>
      }
      <a [routerLink]="createNewTaskURL" routerLinkActive="active" mat-button>New task</a>
      <a [routerLink]="createUserURL" routerLinkActive="active" mat-button>Users</a>
      @if (user.userRole === 'admin') {
        <a routerLink="/users/manage" routerLinkActive="active" mat-button>Manage users</a>
      }
      <span class="nav-user" [title]="user.userName">{{ user.userName }}</span>
      <button type="button" mat-button class="logout-button" (click)="auth.logOut()">Log out</button>
    } @else {
      <a routerLink="/login" mat-button>Log in</a>
    }
  </nav>
</mat-toolbar>
