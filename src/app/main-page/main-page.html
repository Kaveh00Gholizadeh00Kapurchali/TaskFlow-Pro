<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - Dashboard</title>
  <!-- فایل استاتیک CSS تیل‌ویند (بدون کامپایلر جاوااسکریپتی JIT) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-100 p-6 min-h-screen">
  <app-top-nav-bar
    homeURL="/"
    taskManagementURL="/tasks/list"
    createNewTaskURL="/tasks/add"
    timeZone="Asia/Tehran"
  >
  </app-top-nav-bar>
  <!-- کانتینر اصلی -->
  <div class="max-w-4xl mx-auto">
    
    

    <!-- کانتینر ستون‌ها -->
    <div class="bg-gray-200 p-4 rounded-xl flex space-x-4">
      
      <!-- ستون ۱: لیست تسک‌ها (Task List) -->
      <div class="flex-1 bg-white p-4 rounded-lg shadow-sm border border-gray-300">
        <!-- هدر ستون -->
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <p class="font-bold text-gray-700">Task List</p>
          <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full font-semibold">2</span>
        </div>

        <!-- کارت‌های تسک -->
        <div class="space-y-3">
          
          <div class="space-y-3">

        @for (task of taskService.C_tasks(); track task.taskId) {
          <!-- کارت تسک -->
          <div class="p-3 bg-gray-50 border border-gray-200 rounded-md">
            <p class="text-sm text-gray-700 font-medium mb-3">{{ task.taskName }}</p>

            <div class="flex space-x-2">
              <button type="button"
                class="flex-1 flex items-center justify-center bg-white border border-gray-300 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-600 text-gray-600 text-xs py-1.5 px-2 rounded font-medium">
                <!-- آیکون مثبت -->
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>Add to in progress</span>
              </button>

              <!-- دکمه جزئیات -->
              <button type="button"
                class="flex items-center justify-center bg-white border border-gray-300 hover:bg-gray-100 text-gray-600 text-xs py-1.5 px-2 rounded"
                title="Task Details" (click)="openTaskModal(task.taskId)">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </button>
            </div>
          </div>
        }

      </div>

      <!-- ستون ۲: تسک‌های در حال انجام (Tasks in progress) -->
      <div class="flex-1 bg-white p-4 rounded-lg shadow-sm border border-gray-300">
        <!-- هدر ستون -->
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <p class="font-bold text-blue-600">Tasks in progress</p>
          <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-semibold">1</span>
        </div>

        <!-- کارت‌های در حال انجام -->
        <div class="space-y-3">
          <div class="p-3 bg-blue-50 border border-blue-200 rounded-md">
            <p class="text-sm text-blue-900 font-medium mb-3">Create Tailwind Login UI</p>
            
            <div class="flex space-x-2">
              <button type="button" class="flex-1 flex items-center justify-center bg-white border border-blue-200 hover:bg-green-50 hover:border-green-300 hover:text-green-600 text-blue-700 text-xs py-1.5 px-2 rounded font-medium">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span>Mark as Done</span>
              </button>
              
              <button type="button" class="flex items-center justify-center bg-white border border-blue-200 hover:bg-blue-100 text-blue-700 text-xs py-1.5 px-2 rounded" title="Task Details">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
